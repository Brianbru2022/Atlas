name: Deploy Atlas PWA Fixed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source app
        run: |
          set -eux
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          rm -rf extracted app
          unzip -q "$ZIP_FILE" -d extracted
          APP_DIR=$(find extracted -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "Using app dir: $APP_DIR"
          cp -R "$APP_DIR" app
          echo "App files:"
          find app -maxdepth 3 -type f | sort | head -100

      - name: Patch Vite for GitHub Pages
        working-directory: app
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          text = p.read_text()
          if "base: '/Atlas/'" not in text:
              text = text.replace("return {", "return {\n    base: '/Atlas/',", 1)
          p.write_text(text)
          idx = Path('index.html')
          html = idx.read_text()
          html = html.replace('href="/manifest.webmanifest"', 'href="/Atlas/manifest.webmanifest"')
          html = html.replace("navigator.serviceWorker.register('/sw.js')", "navigator.serviceWorker.register('/Atlas/sw.js')")
          idx.write_text(html)
          PY
          sed -n '1,80p' vite.config.ts
          sed -n '1,80p' index.html

      - name: Install and build
        working-directory: app
        run: |
          set -eux
          npm install
          npm run build

      - name: Prepare Pages artifact
        run: |
          set -eux
          rm -rf _site
          mkdir _site
          cp -R app/dist/* _site/
          touch _site/.nojekyll
          echo "Published files:"
          find _site -maxdepth 3 -type f | sort | head -100
          echo "index.html preview:"
          sed -n '1,80p' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
